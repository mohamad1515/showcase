services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: your_username
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: your_database
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U your_username -d your_database"]
      interval: 2s
      timeout: 5s
      retries: 15

  graphql:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: showcase-graphql
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgresql://your_username:your_password@postgres:5432/your_database
      BACKEND_PUBLIC_URL: http://localhost:4000/api
      # Dev-only placeholder — the image runs with NODE_ENV=production
      # baked in, which refuses to boot without a real JWT_SECRET. Never
      # reuse this value outside local development.
      JWT_SECRET: local-dev-only-insecure-secret-do-not-use-in-production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
